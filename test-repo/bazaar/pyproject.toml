[project]
name = "bazaar"
version = "2.11.0"
description = "Marketplace platform monorepo: gateway, catalog, checkout, pricing, inventory, settlement"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
]

[tool.pytest.ini_options]
testpaths = ["tests", "services", "libs"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
